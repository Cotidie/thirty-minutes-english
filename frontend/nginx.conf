server {
    listen 80;
    root /usr/share/nginx/html;

    # The corpus comes back as one JSON of about 0.8 MB; compressed it is a fraction of that.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8765;
        proxy_read_timeout 600s;   # one generation takes 1-2 min on opus
    }

    location / {
        try_files $uri /index.html;
    }
}
