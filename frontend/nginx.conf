server {
    listen 80;
    root /usr/share/nginx/html;

    # The corpus comes back as one JSON of about 0.8 MB; compressed it is a fraction of that.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # The event streams: nothing may hold them back or close them while they are quiet.
    location ~ ^/api/(sessions/[0-9]+|me)/events$ {
        proxy_pass http://backend:8765;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        # This nginx uses up the backend's copy of this header; say it again for an nginx in front of this one.
        add_header X-Accel-Buffering no always;
    }

    location /api/ {
        proxy_pass http://backend:8765;
        proxy_read_timeout 600s;   # one generation takes 1-2 min on opus
    }

    location / {
        try_files $uri /index.html;
    }
}
