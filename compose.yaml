services:
  backend:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        UID: ${UID:-1000}
        HOME_DIR: ${HOME}
    # Every runtime setting (keys, models, providers) comes from .env as is; the ⚙ modal's list
    # (backend/app/config/settings.py) owns their defaults, so none are repeated here.
    env_file:
      - path: .env
        required: false
    environment:
      READ_ALOUD_AGENT_DIR: /agents/read-aloud-coach
      PHRASE_AGENT_DIR: /agents/phrase-coach
      EXAMPLE_AGENT_DIR: /agents/example-coach
    volumes:
      - ./backend/data:/data
      - ../read-aloud-coach:/agents/read-aloud-coach:ro
      - ../phrase-coach:/agents/phrase-coach:ro
      - ../example-coach:/agents/example-coach:ro
      - ${HOME}/.claude/skills:${HOME}/.claude/skills:ro

  frontend:
    restart: unless-stopped
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
