services:
  backend:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        UID: ${UID:-1000}
        HOME_DIR: ${HOME}
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-opus}
      CLAUDE_EFFORT: ${CLAUDE_EFFORT:-xhigh}
      CLAUDE_SKILLS: ${CLAUDE_SKILLS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-koreacentral}
      ASSESS_WORD_SCORE: ${ASSESS_WORD_SCORE:-60}
      ASSESS_BREAK_CONFIDENCE: ${ASSESS_BREAK_CONFIDENCE:-0.75}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-openai}
      VOICE_MODEL: ${VOICE_MODEL:-}
      VOICE_THINKING: ${VOICE_THINKING:-low}
      VOICE_NAME: ${VOICE_NAME:-Kore}
      READ_ALOUD_AGENT_DIR: /agents/read-aloud-coach
      PHRASE_AGENT_DIR: /agents/phrase-coach
      EXAMPLE_AGENT_DIR: /agents/example-coach
      SUMMARY_MODEL: ${SUMMARY_MODEL:-gpt-5.6-luna}
      TOPICS_MODEL: ${TOPICS_MODEL:-sonnet}
      TOPICS_EFFORT: ${TOPICS_EFFORT:-medium}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      COMFY_API_KEY: ${COMFY_API_KEY:-}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-openrouter}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      IMAGE_STYLE: ${IMAGE_STYLE:-photo}
      EXAMPLE_MODEL: ${EXAMPLE_MODEL:-opus}
      EXAMPLE_EFFORT: ${EXAMPLE_EFFORT:-low}
    volumes:
      - ./backend/data:/data
      - ../read-aloud-coach:/agents/read-aloud-coach:ro
      - ../phrase-coach:/agents/phrase-coach:ro
      - ../example-coach:/agents/example-coach:ro
      - ${HOME}/.claude/skills:${HOME}/.claude/skills:ro
      - ${HOME}/.claude/plugins:${HOME}/.claude/plugins:ro
      - ${HOME}/.claude/settings.json:/host-settings.json:ro
      - ${HOME}/.claude/.credentials.json:/host-credentials.json:ro

  frontend:
    restart: unless-stopped
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
