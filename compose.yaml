services:
  backend:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        UID: ${UID:-1000}
    # Every runtime setting (keys, models, providers) comes from .env as is; the ⚙ modal's list
    # (backend/app/config/settings.py) owns their defaults, so none are repeated here.
    env_file:
      - path: .env
        required: false
    environment:
      READ_ALOUD_AGENT_DIR: /agents/read-aloud-coach
      EXAMPLE_AGENT_DIR: /agents/example-coach
      SUMMARY_AGENT_DIR: /agents/summary-coach
    volumes:
      - ./backend/data:/data
      - ./agents/read-aloud-coach:/agents/read-aloud-coach:ro
      - ./agents/example-coach:/agents/example-coach:ro
      - ./agents/summary-coach:/agents/summary-coach:ro

  frontend:
    restart: unless-stopped
    build: ./frontend
    # This machine only: a public address, with HTTPS for the login cookie, is the job of a proxy or tunnel in front.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
